<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>S Pen PDF Multi-Page Signer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --accent-color: #0d6efd;
      --active-green: #198754;
      --text-color: #ffffff;
      --header-height: 54px;
      --bottom-bar-height: 60px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh; /* Dynamic viewport height fixes mobile browser address bar jumps */
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* Fixed Top Mobile Action Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      background-color: var(--panel-bg);
      padding: 0 8px;
      padding-top: env(safe-area-inset-top);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
      z-index: 30;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    button, label.btn {
      background-color: #2c2c2c;
      color: white;
      border: 1px solid #444;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      user-select: none;
    }
    button:active, label.btn:active {
      opacity: 0.8;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button.primary {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }
    
    /* Dedicated Signing Mode Toggle */
    #mode-toggle {
      background-color: #333;
      border: 1px solid #555;
      color: #fff;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    #mode-toggle.active {
      background-color: var(--active-green);
      border-color: var(--active-green);
      box-shadow: 0 0 10px rgba(25, 135, 84, 0.5);
    }

    input[type="file"] {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    .color-picker {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: none;
      flex-shrink: 0;
    }

    /* Viewer Canvas Container */
    #viewer-container {
      position: absolute;
      top: var(--header-height);
      bottom: calc(var(--bottom-bar-height) + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      overflow: auto;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 8px;
      touch-action: pan-x pan-y pinch-zoom;
    }

    #viewer-container.signing-active {
      touch-action: none;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      background-color: white;
      transform-origin: top center;
    }
    canvas {
      display: block;
    }
    .drawing-canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 5;
      pointer-events: none;
    }
    #viewer-container.signing-active .drawing-canvas {
      pointer-events: auto;
    }

    .status-text {
      font-size: 12px;
      font-weight: 600;
      color: #ddd;
      white-space: nowrap;
    }

    #drop-zone {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: rgba(30, 30, 30, 0.95);
      width: 85%;
      max-width: 320px;
    }

    /* Fixed Mobile Bottom Toolbar with Horizontal Scroll support */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--bottom-bar-height) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background-color: var(--panel-bg);
      border-top: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 8px;
      padding-right: 8px;
      z-index: 30;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      gap: 8px;
    }

    /* Modals & Library */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      width: 88%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-content input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #111;
      color: #fff;
      font-size: 16px;
    }
    .sig-library-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 0;
    }
    .sig-item {
      border: 1px solid #444;
      border-radius: 6px;
      padding: 6px;
      background: #fff;
      cursor: pointer;
      max-height: 60px;
    }
  </style>
</head>
<body>

  <!-- Fixed Top Mobile Toolbar -->
  <header>
    <div class="btn-group">
      <button id="open-btn">📁 Open</button>
      <input type="file" id="pdf-input" accept="application/pdf,*/*">
      <button id="save-btn" class="primary" disabled>💾 Save</button>
    </div>

    <!-- Mode Switcher -->
    <button id="mode-toggle" disabled>🖐️ Navigate</button>

    <!-- Undo / Redo Controls -->
    <div class="btn-group">
      <button id="undo-btn" title="Undo" disabled>↩️</button>
      <button id="redo-btn" title="Redo" disabled>↪️</button>
    </div>
  </header>

  <!-- PDF Viewer Container -->
  <div id="viewer-container">
    <div id="drop-zone">
      <h3>Tap "Open" to load PDF</h3>
      <p style="font-size: 12px; color: #aaa;">Scroll & pinch to zoom naturally. Switch to <b>Navigate Mode</b> button above to start drawing.</p>
    </div>
    <div class="page-wrapper" id="page-wrapper" style="display:none;">
      <canvas id="pdf-render"></canvas>
      <canvas id="draw-canvas" class="drawing-canvas"></canvas>
    </div>
  </div>

  <!-- Fixed Bottom Navigation & Tools Bar -->
  <footer>
    <div class="btn-group">
      <button id="prev-page" disabled>❮</button>
      <span class="status-text"><span id="page-num">0</span>/<span id="page-count">0</span></span>
      <button id="next-page" disabled>❯</button>
    </div>

    <div class="btn-group">
      <input type="color" id="pen-color" class="color-picker" value="#000d66" title="Ink Color">
      <button id="gen-sig-btn" disabled>✍️ Auto</button>
      <button id="save-sig-lib" disabled>💾 Save Sig</button>
      <button id="open-lib-btn">📦 Lib (<span id="lib-count">0</span>)</button>
      <button id="clear-canvas" disabled>🧹 Clear</button>
    </div>
  </footer>

  <!-- Auto Signature Generator Modal -->
  <div class="modal" id="sig-modal">
    <div class="modal-content">
      <h3>Generate Signature</h3>
      <input type="text" id="name-input" placeholder="Enter full name...">
      <div class="btn-group" style="justify-content: flex-end;">
        <button id="close-modal">Cancel</button>
        <button id="place-sig-btn" class="primary">Place Signature</button>
      </div>
    </div>
  </div>

  <!-- Saved Signatures Library Modal -->
  <div class="modal" id="lib-modal">
    <div class="modal-content">
      <h3>Signature Library</h3>
      <div id="library-container" class="sig-library-grid">
        <p style="color:#aaa; font-size: 13px;">No saved signatures in this session yet.</p>
      </div>
      <div class="btn-group" style="justify-content: flex-end;">
        <button id="close-lib-modal">Close</button>
      </div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let baseScale = 2.0;
    let rawPdfBytes = null;

    const pageSignatures = {};
    const signatureLibrary = [];

    const undoStacks = {};
    const redoStacks = {};

    let isSigningMode = false;

    const pageWrapper = document.getElementById('page-wrapper');
    const pdfCanvas = document.getElementById('pdf-render');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const fileInput = document.getElementById('pdf-input');
    const openBtn = document.getElementById('open-btn');
    const viewerContainer = document.getElementById('viewer-container');
    const modeToggle = document.getElementById('mode-toggle');
    const undoBtn = document.getElementById('undo-btn');
    const redoBtn = document.getElementById('redo-btn');

    let isDrawing = false;
    let points = [];
    let penColor = document.getElementById('pen-color').value;

    let activeSigBox = null;

    document.getElementById('pen-color').addEventListener('change', (e) => {
      penColor = e.target.value;
    });

    openBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('drop-zone').style.display = 'none';
      pageWrapper.style.display = 'block';

      rawPdfBytes = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: rawPdfBytes });
      pdfDoc = await loadingTask.promise;

      document.getElementById('page-count').textContent = pdfDoc.numPages;
      document.getElementById('save-btn').disabled = false;
      document.getElementById('clear-canvas').disabled = false;
      document.getElementById('gen-sig-btn').disabled = false;
      document.getElementById('save-sig-lib').disabled = false;
      modeToggle.disabled = false;
      
      pageNum = 1;
      renderPage(pageNum);
    });

    async function renderPage(num) {
      const page = await pdfDoc.getPage(num);
      const viewport = page.getViewport({ scale: baseScale });

      pdfCanvas.height = viewport.height;
      pdfCanvas.width = viewport.width;
      pdfCanvas.style.width = (viewport.width / baseScale) + 'px';
      pdfCanvas.style.height = (viewport.height / baseScale) + 'px';

      drawCanvas.height = viewport.height;
      drawCanvas.width = viewport.width;
      drawCanvas.style.width = (viewport.width / baseScale) + 'px';
      drawCanvas.style.height = (viewport.height / baseScale) + 'px';

      await page.render({ canvasContext: pdfCtx, viewport: viewport }).promise;

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (pageSignatures[num]) {
        const img = new Image();
        img.onload = () => drawCtx.drawImage(img, 0, 0);
        img.src = pageSignatures[num];
      }

      document.getElementById('page-num').textContent = num;
      document.getElementById('prev-page').disabled = num <= 1;
      document.getElementById('next-page').disabled = num >= pdfDoc.numPages;

      if (!undoStacks[num]) undoStacks[num] = [];
      if (!redoStacks[num]) redoStacks[num] = [];
      updateUndoRedoUI();
    }

    modeToggle.addEventListener('click', () => {
      isSigningMode = !isSigningMode;
      if (isSigningMode) {
        modeToggle.textContent = '✍️ Sign Mode';
        modeToggle.classList.add('active');
        viewerContainer.classList.add('signing-active');
      } else {
        modeToggle.textContent = '🖐️ Navigate';
        modeToggle.classList.remove('active');
        viewerContainer.classList.remove('signing-active');
      }
    });

    function saveCanvasState() {
      if (!undoStacks[pageNum]) undoStacks[pageNum] = [];
      undoStacks[pageNum].push(drawCanvas.toDataURL('image/png'));
      redoStacks[pageNum] = [];
      autoSaveCurrentPage();
      updateUndoRedoUI();
    }

    function updateUndoRedoUI() {
      const uStack = undoStacks[pageNum] || [];
      const rStack = redoStacks[pageNum] || [];
      undoBtn.disabled = uStack.length === 0;
      redoBtn.disabled = rStack.length === 0;
    }

    undoBtn.addEventListener('click', () => {
      const uStack = undoStacks[pageNum];
      if (!uStack || uStack.length === 0) return;

      if (!redoStacks[pageNum]) redoStacks[pageNum] = [];
      redoStacks[pageNum].push(drawCanvas.toDataURL('image/png'));

      const prevState = uStack.pop();
      restoreCanvasFromDataUrl(prevState);
      updateUndoRedoUI();
    });

    redoBtn.addEventListener('click', () => {
      const rStack = redoStacks[pageNum];
      if (!rStack || rStack.length === 0) return;

      undoStacks[pageNum].push(drawCanvas.toDataURL('image/png'));

      const nextState = rStack.pop();
      restoreCanvasFromDataUrl(nextState);
      updateUndoRedoUI();
    });

    function restoreCanvasFromDataUrl(dataUrl) {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (dataUrl) {
        const img = new Image();
        img.onload = () => {
          drawCtx.drawImage(img, 0, 0);
          autoSaveCurrentPage();
        };
        img.src = dataUrl;
      } else {
        autoSaveCurrentPage();
      }
    }

    function autoSaveCurrentPage() {
      if (pdfDoc && drawCanvas.width > 0) {
        pageSignatures[pageNum] = drawCanvas.toDataURL('image/png');
      }
    }

    document.getElementById('prev-page').addEventListener('click', () => {
      if (pageNum <= 1) return;
      autoSaveCurrentPage();
      pageNum--;
      renderPage(pageNum);
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (pageNum >= pdfDoc.numPages) return;
      autoSaveCurrentPage();
      pageNum++;
      renderPage(pageNum);
    });

    document.getElementById('clear-canvas').addEventListener('click', () => {
      saveCanvasState();
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      delete pageSignatures[pageNum];
      activeSigBox = null;
    });

    let activeTouches = [];
    let initialTouchDist = 0;
    let initialSigScale = 1.0;

    function getDistance(t1, t2) {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    viewerContainer.addEventListener('touchstart', (e) => {
      if (!isSigningMode) return;
      activeTouches = Array.from(e.touches);

      if (activeTouches.length === 2 && activeSigBox) {
        isDrawing = false;
        initialTouchDist = getDistance(activeTouches[0], activeTouches[1]);
        initialSigScale = activeSigBox.scale;
      }
    }, { passive: false });

    viewerContainer.addEventListener('touchmove', (e) => {
      if (!isSigningMode) return;
      activeTouches = Array.from(e.touches);

      if (activeTouches.length === 2 && activeSigBox) {
        e.preventDefault();
        const currentDist = getDistance(activeTouches[0], activeTouches[1]);
        const scaleChange = currentDist / initialTouchDist;

        activeSigBox.scale = Math.max(0.2, initialSigScale * scaleChange);
        redrawActiveSignatureBox();
      }
    }, { passive: false });

    viewerContainer.addEventListener('touchend', (e) => {
      if (!isSigningMode) return;
      activeTouches = Array.from(e.touches);
      if (activeTouches.length < 2 && activeSigBox) {
        commitActiveSignatureBox();
      }
    });

    function getPointerPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY,
        pressure: e.pressure && e.pressure > 0 ? e.pressure : 0.5
      };
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
      if (!isSigningMode || activeTouches.length >= 2) return;

      saveCanvasState();
      isDrawing = true;
      drawCanvas.setPointerCapture(e.pointerId);
      points = [getPointerPos(e)];
    });

    drawCanvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || !isSigningMode || activeTouches.length >= 2) return;
      points.push(getPointerPos(e));

      if (points.length < 3) return;

      const p1 = points[points.length - 3];
      const p2 = points[points.length - 2];
      const p3 = points[points.length - 1];

      const mid1 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const mid2 = { x: (p2.x + p3.x) / 2, y: (p2.y + p3.y) / 2 };

      drawCtx.beginPath();
      drawCtx.moveTo(mid1.x, mid1.y);
      drawCtx.quadraticCurveTo(p2.x, p2.y, mid2.x, mid2.y);
      
      drawCtx.strokeStyle = penColor;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      
      const width = Math.max(3, p2.pressure * 10 * baseScale);
      drawCtx.lineWidth = width;
      drawCtx.stroke();
    });

    drawCanvas.addEventListener('pointerup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      drawCanvas.releasePointerCapture(e.pointerId);
      points = [];
      autoSaveCurrentPage();
    });

    function placeResizableSignature(dataUrl) {
      saveCanvasState();
      const img = new Image();
      img.onload = () => {
        activeSigBox = {
          img: img,
          x: drawCanvas.width / 4,
          y: drawCanvas.height / 3,
          width: img.width / 2,
          height: img.height / 2,
          scale: 1.0
        };
        redrawActiveSignatureBox();
      };
      img.src = dataUrl;
    }

    function redrawActiveSignatureBox() {
      if (!activeSigBox) return;

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (pageSignatures[pageNum]) {
        const bgImg = new Image();
        bgImg.src = pageSignatures[pageNum];
        drawCtx.drawImage(bgImg, 0, 0);
      }

      const w = activeSigBox.width * activeSigBox.scale;
      const h = activeSigBox.height * activeSigBox.scale;

      drawCtx.drawImage(activeSigBox.img, activeSigBox.x, activeSigBox.y, w, h);

      drawCtx.save();
      drawCtx.strokeStyle = '#0d6efd';
      drawCtx.lineWidth = 2 * baseScale;
      drawCtx.setLineDash([6, 6]);
      drawCtx.strokeRect(activeSigBox.x - 5, activeSigBox.y - 5, w + 10, h + 10);
      drawCtx.restore();
    }

    function commitActiveSignatureBox() {
      if (!activeSigBox) return;

      const w = activeSigBox.width * activeSigBox.scale;
      const h = activeSigBox.height * activeSigBox.scale;

      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (pageSignatures[pageNum]) {
        const bgImg = new Image();
        bgImg.src = pageSignatures[pageNum];
        drawCtx.drawImage(bgImg, 0, 0);
      }

      drawCtx.drawImage(activeSigBox.img, activeSigBox.x, activeSigBox.y, w, h);
      activeSigBox = null;
      autoSaveCurrentPage();
    }

    document.getElementById('save-sig-lib').addEventListener('click', () => {
      const dataUrl = drawCanvas.toDataURL('image/png');
      signatureLibrary.push(dataUrl);
      
      document.getElementById('lib-count').textContent = signatureLibrary.length;
      alert("Signature saved to library!");
    });

    const libModal = document.getElementById('lib-modal');
    document.getElementById('open-lib-btn').addEventListener('click', () => {
      const container = document.getElementById('library-container');
      container.innerHTML = '';

      if (signatureLibrary.length === 0) {
        container.innerHTML = `<p style="color:#aaa; font-size: 13px;">No saved signatures in this session yet.</p>`;
      } else {
        signatureLibrary.forEach((sigUrl) => {
          const img = document.createElement('img');
          img.src = sigUrl;
          img.className = 'sig-item';
          img.onclick = () => {
            placeResizableSignature(sigUrl);
            libModal.style.display = 'none';
          };
          container.appendChild(img);
        });
      }
      libModal.style.display = 'flex';
    });

    document.getElementById('close-lib-modal').addEventListener('click', () => {
      libModal.style.display = 'none';
    });

    const sigModal = document.getElementById('sig-modal');
    document.getElementById('gen-sig-btn').addEventListener('click', () => {
      sigModal.style.display = 'flex';
    });
    document.getElementById('close-modal').addEventListener('click', () => {
      sigModal.style.display = 'none';
    });

    document.getElementById('place-sig-btn').addEventListener('click', () => {
      const name = document.getElementById('name-input').value.trim();
      if (!name) return;

      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 400 * baseScale;
      tempCanvas.height = 150 * baseScale;
      const tCtx = tempCanvas.getContext('2d');

      tCtx.font = `${48 * baseScale}px 'Great Vibes', cursive`;
      tCtx.fillStyle = penColor;
      tCtx.textBaseline = 'middle';
      tCtx.fillText(name, 20, tempCanvas.height / 2);

      placeResizableSignature(tempCanvas.toDataURL('image/png'));
      sigModal.style.display = 'none';
    });

    document.getElementById('save-btn').addEventListener('click', async () => {
      autoSaveCurrentPage();

      const { PDFDocument } = PDFLib;
      const loadedPdf = await PDFDocument.load(rawPdfBytes);
      const pages = loadedPdf.getPages();

      let modified = false;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const dataUrl = pageSignatures[i];
        if (!dataUrl) continue;

        const checkCanvas = document.createElement('canvas');
        checkCanvas.width = drawCanvas.width;
        checkCanvas.height = drawCanvas.height;
        const checkCtx = checkCanvas.getContext('2d');
        const img = new Image();
        
        await new Promise((resolve) => {
          img.onload = resolve;
          img.src = dataUrl;
        });

        checkCtx.drawImage(img, 0, 0);
        const hasInk = checkCtx.getImageData(0, 0, checkCanvas.width, checkCanvas.height).data.some(p => p !== 0);

        if (hasInk) {
          const pngImage = await loadedPdf.embedPng(dataUrl);
          const pdfPage = pages[i - 1];
          const { width, height } = pdfPage.getSize();

          pdfPage.drawImage(pngImage, {
            x: 0,
            y: 0,
            width: width,
            height: height,
          });
          modified = true;
        }
      }

      if (!modified) {
        alert("No signatures found. Please sign at least one page.");
        return;
      }

      const pdfBytes = await loadedPdf.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'signed_document.pdf';
      link.click();
    });
  </script>
</body>
</html>
