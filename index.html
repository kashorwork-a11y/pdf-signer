<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Signature & Editor Toolkit</title>
  <!-- PDF.js Library for PDF rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f5;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* -------------------------------------------------------------
       FIXED TOP & BOTTOM TOOLBARS (Pinned across zoom/pan)
       ------------------------------------------------------------- */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .top-bar, .bottom-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .top-bar { top: 15px; }
    .bottom-bar { bottom: 15px; }

    .btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #6c757d; }
    .btn-secondary:hover { background-color: #545b62; }
    .btn-success { background-color: #28a745; }
    .btn-success:hover { background-color: #218838; }

    .file-input { display: none; }

    .page-info {
      font-size: 13px;
      font-weight: bold;
      color: #333;
      padding: 0 8px;
    }

    /* -------------------------------------------------------------
       SIGNATURE LIBRARY DRAWER
       ------------------------------------------------------------- */
    .library-drawer {
      position: fixed;
      right: 15px;
      top: 75px;
      width: 220px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      padding: 12px;
      pointer-events: auto;
      display: none;
      flex-direction: column;
      gap: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .library-drawer.open { display: flex; }

    .library-item {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      background: #f8f9fa;
      transition: border-color 0.2s;
    }

    .library-item:hover { border-color: #007bff; }

    /* -------------------------------------------------------------
       WORKSPACE & CANVAS
       ------------------------------------------------------------- */
    .viewport {
      width: 100vw;
      height: 100vh;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 80px 20px;
    }

    .pdf-page {
      position: relative;
      background: white;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transform-origin: center center;
      user-select: none;
    }

    canvas {
      display: block;
    }

    /* -------------------------------------------------------------
       SIGNATURE ITEM STYLE
       ------------------------------------------------------------- */
    .pdf-signature {
      position: absolute;
      cursor: grab;
      border: 2px dashed #007bff;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 6px;
      font-weight: bold;
      color: #222;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .pdf-signature:active { cursor: grabbing; }

    .placeholder-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- FIXED OVERLAY UI -->
  <div class="ui-overlay">
    
    <!-- TOP TOOLBAR -->
    <div class="top-bar">
      <!-- Add PDF File -->
      <button class="btn btn-success" onclick="document.getElementById('pdfInput').click()">+ Add PDF</button>
      <input type="file" id="pdfInput" class="file-input" accept="application/pdf" onchange="loadPdfFile(event)">

      <!-- Signature Actions -->
      <button class="btn" onclick="addTextSignature()">+ Create Signature</button>
      <button class="btn btn-secondary" onclick="toggleLibrary()">Signature Library</button>
      
      <!-- Mode Toggle -->
      <button class="btn btn-secondary" id="modeBtn" onclick="toggleMode()">Mode: Navigation</button>
    </div>

    <!-- SIGNATURE LIBRARY DRAWER -->
    <div class="library-drawer" id="libraryDrawer">
      <strong>Saved Signatures</strong>
      <div class="library-item" onclick="insertFromLibrary('John Doe')">John Doe</div>
      <div class="library-item" onclick="insertFromLibrary('Approved')">Approved Stamp</div>
      <div class="library-item" onclick="insertFromLibrary('Verified ✓')">Verified ✓</div>
    </div>

    <!-- BOTTOM NAVIGATION & ZOOM TOOLBAR -->
    <div class="bottom-bar">
      <button class="btn btn-secondary" onclick="changePage(-1)">Prev</button>
      <span class="page-info" id="pageInfo">Page 0 / 0</span>
      <button class="btn btn-secondary" onclick="changePage(1)">Next</button>
      
      <span style="border-left: 1px solid #ccc; height: 20px; margin: 0 4px;"></span>

      <button class="btn" onclick="adjustZoom(0.1)">Zoom In (+)</button>
      <button class="btn" onclick="adjustZoom(-0.1)">Zoom Out (-)</button>
      <button class="btn btn-secondary" onclick="resetZoom()">Reset Zoom</button>
    </div>

  </div>

  <!-- PDF VIEWPORT -->
  <div class="viewport">
    <div class="pdf-page" id="pdfPage">
      <div class="placeholder-text" id="placeholder">Click "+ Add PDF" to upload a document</div>
      <canvas id="pdfCanvas"></canvas>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let pageNum = 1;
    let currentScale = 1.0;
    let isNavMode = true;
    let activeSignature = null;
    let dragOffset = { x: 0, y: 0 };

    const pdfPage = document.getElementById('pdfPage');
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');

    // --- 1. PDF FILE LOADING & PAGE RENDERING ---
    function loadPdfFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileReader = new FileReader();
      fileReader.onload = function () {
        const typedarray = new Uint8Array(this.result);
        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
          pdfDoc = pdf;
          pageNum = 1;
          document.getElementById('placeholder').style.display = 'none';
          renderPage(pageNum);
        });
      };
      fileReader.readAsArrayBuffer(file);
    }

    function renderPage(num) {
      pdfDoc.getPage(num).then(page => {
        const viewport = page.getViewport({ scale: 1.5 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        pdfPage.style.width = viewport.width + 'px';
        pdfPage.style.height = viewport.height + 'px';

        const renderContext = {
          canvasContext: ctx,
          viewport: viewport
        };
        page.render(renderContext);

        document.getElementById('pageInfo').textContent = `Page ${num} / ${pdfDoc.numPages}`;
      });
    }

    function changePage(delta) {
      if (!pdfDoc) return;
      if (pageNum + delta >= 1 && pageNum + delta <= pdfDoc.numPages) {
        pageNum += delta;
        renderPage(pageNum);
      }
    }

    // --- 2. ZOOM SYSTEM ---
    function adjustZoom(amount) {
      currentScale = Math.max(0.5, Math.min(2.5, currentScale + amount));
      pdfPage.style.transform = `scale(${currentScale})`;
    }

    function resetZoom() {
      currentScale = 1.0;
      pdfPage.style.transform = `scale(1.0)`;
    }

    function toggleMode() {
      isNavMode = !isNavMode;
      document.getElementById('modeBtn').textContent = isNavMode ? 'Mode: Navigation' : 'Mode: Edit';
    }

    function toggleLibrary() {
      const drawer = document.getElementById('libraryDrawer');
      drawer.classList.toggle('open');
    }

    // --- 3. DRAG AND DROP SIGNATURE SYSTEM ---
    function makeDraggable(element) {
      element.addEventListener('mousedown', startDrag);
      element.addEventListener('touchstart', startDrag, { passive: false });
    }

    function startDrag(e) {
      activeSignature = e.currentTarget;

      const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

      const rect = activeSignature.getBoundingClientRect();
      dragOffset.x = (clientX - rect.left) / currentScale;
      dragOffset.y = (clientY - rect.top) / currentScale;

      document.addEventListener('mousemove', onDrag);
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchmove', onDrag, { passive: false });
      document.addEventListener('touchend', stopDrag);
    }

    function onDrag(e) {
      if (!activeSignature) return;
      e.preventDefault();

      const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
      const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

      const pdfRect = pdfPage.getBoundingClientRect();

      let newX = (clientX - pdfRect.left) / currentScale - dragOffset.x;
      let newY = (clientY - pdfRect.top) / currentScale - dragOffset.y;

      activeSignature.style.left = `${newX}px`;
      activeSignature.style.top = `${newY}px`;
    }

    function stopDrag() {
      activeSignature = null;
      document.removeEventListener('mousemove', onDrag);
      document.removeEventListener('mouseup', stopDrag);
      document.removeEventListener('touchmove', onDrag);
      document.removeEventListener('touchend', stopDrag);
    }

    // --- 4. SIGNATURE CREATION & LIBRARY INSERTION ---
    function addTextSignature() {
      const text = prompt("Enter signature text:", "New Signature");
      if (text) {
        insertSignatureElement(text);
      }
    }

    function insertFromLibrary(text) {
      insertSignatureElement(text);
      toggleLibrary();
    }

    function insertSignatureElement(text) {
      const sig = document.createElement('div');
      sig.className = 'pdf-signature';
      sig.textContent = text;
      sig.style.left = '50px';
      sig.style.top = '50px';

      makeDraggable(sig);
      pdfPage.appendChild(sig);
    }
  </script>
</body>
</html>
